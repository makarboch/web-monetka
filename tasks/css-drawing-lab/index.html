<!DOCTYPE html> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Динозавр - первая лабораторная по ВиПС</title>
  <link rel="stylesheet" href="pic.css">
<base target="_blank">
</head>
<body>
  <main class="scene">
    <!-- главный холст -->
    <div class="canvas" role="img" aria-label="Рисунок: зелёный динозавр с рожками стоит на жёлто-оранжевом полосатом полу, рядом трава и ветка с листьями">

      <!-- пол -->
      <div class="floor"></div>

      <!-- динозавр -->
      <div class="dinosaur">
        <div class="tail"></div>
        <div class="hand lhand">
          <div class="forearm"></div>
        </div>
        <div class="hand rhand">
          <div class="forearm"></div>
        </div>
        <div class="leg lleg"></div>
        <div class="foot lfoot"></div>
        <div class="leg rleg"></div>
        <div class="foot rfoot"></div>
        <div class="belly"></div>
        <div class="neck"></div>
        <div class="head"></div>
        <div class="horn lhorn"></div>
        <div class="horn rhorn"></div>
        <div class="tooth tooth1"></div>
        <div class="tooth tooth2"></div>
        <div class="tooth tooth3"></div>
        <div class="tooth tooth4"></div>
        <div class="eye leye">
          <div class="pupil"></div>
        </div>
        <div class="eye reye">
          <div class="pupil"></div>
        </div>
        <div class="nostril lnostril"></div>
        <div class="nostril rnostril"></div>
      </div>

      <!-- ветка с листьями -->
      <div class="branch"></div>
      <div class="leaf leaf1"></div>
      <div class="leaf leaf2"></div>
      <div class="leaf leaf3"></div>

      <!-- трава -->
      <div class="grass grass1"></div>
      <div class="grass grass2"></div>
      <div class="grass grass3"></div>

    </div>
  </main>
</body>
